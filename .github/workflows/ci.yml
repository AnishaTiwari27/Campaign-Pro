name: CI

on:
  push:
    branches: [main]
  pull_request:

# Each Go module under this go.work is built/vetted/tested/linted
# independently — `go build ./...` from the repo root doesn't work in this
# multi-module workspace (there's no module at the root itself, only
# go.work), matching how it has to be run locally too.
jobs:
  go:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module:
          - platform
          - services/auth
          - services/campaigns
          - services/catalog
          - services/analytics
          - services/notifications
          - services/gateway
          - backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: Build
        working-directory: ${{ matrix.module }}
        run: go build ./...
      - name: Vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...
      - name: Test
        working-directory: ${{ matrix.module }}
        run: go test ./...
      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: ${{ matrix.module }}

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run build
