# Written to the spec, but NOT verified: the machine this repo was built on
# has no Docker. The verified path is the native one — see the Makefile and
# README ("Running it"). Treat this file as a starting point, not a tested
# artifact.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: campaign_tracker_pro
      POSTGRES_USER: campaign_tracker_pro
      POSTGRES_PASSWORD: campaign_tracker_pro_dev_pw
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campaign_tracker_pro -d campaign_tracker_pro"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://campaign_tracker_pro:campaign_tracker_pro_dev_pw@db:5432/campaign_tracker_pro?sslmode=disable
      PORT: "8090"
      TZ: Asia/Kolkata
      MAIL_MODE: log
      ADMIN_EMAIL: anishatiwari695@gmail.com
    ports:
      - "8090:8090"
    depends_on:
      db:
        condition: service_healthy

  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_PROXY_TARGET: http://api:8090
    volumes:
      - ./web:/app
      - web-node-modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  db-data:
  web-node-modules:
