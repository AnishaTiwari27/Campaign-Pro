# Runs the production image locally against a throwaway Postgres — the same
# single container that gets deployed, so what you test here is what ships.
#
# Still unverified on this machine: it has no Docker. Treat a first run as a
# test of this file as much as of the app.
#
#   docker compose up --build   then open http://localhost:8090
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: campaign_tracker_pro
      POSTGRES_USER: campaign_tracker_pro
      POSTGRES_PASSWORD: campaign_tracker_pro_dev_pw
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campaign_tracker_pro -d campaign_tracker_pro"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    # One service, not two: the Go binary serves the API and the built
    # frontend from the same origin. See the Dockerfile for why that matters.
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://campaign_tracker_pro:campaign_tracker_pro_dev_pw@db:5432/campaign_tracker_pro?sslmode=disable
      PORT: "8090"
      TZ: Asia/Kolkata
      MAIL_MODE: log
      # Off here only because local compose is plain http. Any real deployment
      # must set this true, or the session cookie goes out without Secure.
      SECURE_COOKIES: "false"
    ports:
      - "8090:8090"
    depends_on:
      db:
        condition: service_healthy
    # The server migrates on boot, so a fresh volume comes up with a schema.
    # To load demo data as well, once the stack is up:
    #   docker compose exec app createuser -email you@example.com -name 'You'

volumes:
  db-data:
